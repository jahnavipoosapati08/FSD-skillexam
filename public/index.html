<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Movie Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <h1>Local Movie Club</h1>
    <div id="session" hidden>
      <span id="who"></span>
      <button class="link" id="logout">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Sign in / register -->
    <section id="auth" class="sheet narrow">
      <h2 id="auth-title">Sign in to the club register</h2>
      <form id="auth-form" novalidate>
        <label id="name-row" hidden>Name <input name="name" autocomplete="name" maxlength="60"></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required></label>
        <p class="error" id="auth-error" role="alert"></p>
        <button class="primary" type="submit" id="auth-submit">Sign in</button>
      </form>
      <p class="swap"><span id="swap-text">New to the club?</span> <button class="link" id="swap">Create an account</button></p>
    </section>

    <!-- Register -->
    <section id="app" hidden>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search title or director" aria-label="Search title or director">
        <select id="genre-filter" aria-label="Filter by genre"><option value="">All genres</option></select>
        <button class="primary" id="add">Add movie</button>
      </div>
      <p class="error" id="list-error" role="alert"></p>
      <div class="ledger" role="table" aria-label="Movies">
        <div class="row head" role="row">
          <span role="columnheader">Rating</span><span role="columnheader">Title</span>
          <span role="columnheader">Genre</span><span role="columnheader">Released</span>
          <span role="columnheader">Director</span><span role="columnheader"></span>
        </div>
        <div id="rows"></div>
      </div>
      <p id="empty" class="empty" hidden>No movies on the register yet. Add the first one.</p>
    </section>
  </main>

  <dialog id="form-dialog">
    <form id="movie-form" novalidate>
      <h2 id="form-title">Add movie</h2>
      <label>Title <input name="title" maxlength="150" required></label>
      <label>Genre <input name="genre" maxlength="50" required></label>
      <label>Release date <input name="releaseDate" type="date" required></label>
      <label>Rating (0 to 10) <input name="rating" type="number" min="0" max="10" step="0.1" required></label>
      <label>Director <input name="director" maxlength="100" required></label>
      <p class="error" id="form-error" role="alert"></p>
      <div class="actions">
        <button type="button" class="ghost" id="form-cancel">Cancel</button>
        <button type="submit" class="primary">Save movie</button>
      </div>
    </form>
  </dialog>

  <dialog id="detail-dialog">
    <h2 id="d-title"></h2>
    <dl id="d-list"></dl>
    <div class="actions"><button class="ghost" id="d-close">Close</button></div>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2>Delete this movie?</h2>
      <p id="confirm-text"></p>
      <div class="actions">
        <button value="cancel" class="ghost">Keep movie</button>
        <button value="ok" class="danger">Delete movie</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
